[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-a-share-trader"
version = "0.1.0"
description = "Local A-share technical analysis with Jev structured decisions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<4", "numpy>=2,<3", "TA-Lib>=0.6,<1",
  "akshare>=1.18.96,<2", "httpx[socks]>=0.28,<1", "pydantic>=2.9,<3",
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
jev = "jev_trader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jev_trader = ["web/**/*", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
